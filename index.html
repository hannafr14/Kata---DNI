<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNI Calc</title>
</head>
<body>
    <main>
        <section id="intro-section">
            <h1>Calculadora de la letra del DNI</h1>
            <p>Introduce un número de DNI para calcular su letra correspondiente.</p>
            <button id="start-button">Iniciar</button>
        </section>

        <section id="calculator-section" hidden>
            <h1>Introduce tu DNI</h1>
            <p>8 dígitos, sin la letra.</p>

            <label for="dni-input">Número</label>
            <input id="dni-input" type="text" maxlength="8" placeholder="12345678">

            <p id="error-message" hidden>Los datos introducidos no son válidos</p>

            <button id="calculate-button">Calcular letra</button>
            <button id="cancel-button">Cancelar proceso</button>
        </section>

        <section id="result-section" hidden>
            <p>Letra de identidad</p>

            <div id="result-letter"></div>

            <p id="result-dni"></p>
            <p id="result-description"></p>

            <button id="new-calculation-button">Nuevo cálculo</button>
            <button id="finish-button">Finalizar programa</button>
        </section>
    </main>
    
    <script type="module" src="./src/main.js"></script>
</body>
</html>
